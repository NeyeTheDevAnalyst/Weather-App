<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="title">Sky Whisper</h1>
        </nav>
    </header>

    <div class = "container">
        

        <div class = "weather_container">


            <div class = "temp">
                <p class="temp_value">20</p>
            </div>

            <div class = "time_location">
                <p>Lagos</p>
                <span>12:30 - Saturday 2026-04-03</span>
            </div>

            <div class = "condition">
                <p class = "condition_value">Cloudy</p>
            </div>


        </div>

        <nav>

            <form>
                    <input type="text" placeholder="Search Location" class='search_area'>
                    <button type="submit">Search</button>
            </form>
        </nav>


    </div>


    


</body>
<script src="script.js"></script>
</html>
